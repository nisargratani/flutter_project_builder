name: flutter_project_builder
description: >-
  CLI that scaffolds Clean Architecture into a Flutter app, configures native
  flavors and app IDs, and generates features, pages, widgets, providers and
  models.
version: 0.1.0
homepage: https://github.com/nisargratani/flutter_project_builder
repository: https://github.com/nisargratani/flutter_project_builder
issue_tracker: https://github.com/nisargratani/flutter_project_builder/issues
topics:
  - cli
  - scaffolding
  - architecture
  - riverpod
  - flavors

environment:
  sdk: ^3.4.0

dependencies:
  args: ^2.5.0
  path: ^1.9.0
  pub_semver: ^2.1.4
  yaml: ^3.1.2
  yaml_edit: ^2.2.1

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.8

executables:
  flutter_project_builder: flutter_project_builder
