name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

      - name: Publish dry-run
        run: dart pub publish --dry-run

  lower-bounds:
    name: Lowest dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve lowest versions
        run: dart pub downgrade

      - name: Analyze
        run: dart analyze --fatal-infos lib bin

  integration:
    name: Generated project (${{ matrix.name }}, Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.x', '3.32.x']
        name: [clean, basic, enterprise, minimal]
        include:
          - name: clean
            args: ''
          - name: basic
            args: '--template=basic'
          - name: enterprise
            args: '--template=enterprise --org=io.acme --firebase'
          - name: minimal
            args: '--no-sample --no-dio --no-hive --no-localization'
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable

      - name: Activate CLI from source
        run: dart pub global activate --source path .

      - name: Create Flutter app
        run: flutter create --no-pub --project-name my_app "$RUNNER_TEMP/app"

      - name: Generate architecture
        working-directory: ${{ runner.temp }}/app
        run: dart pub global run flutter_project_builder create --no-interactive ${{ matrix.args }}

      - name: Generate building blocks
        working-directory: ${{ runner.temp }}/app
        run: |
          fpb() { dart pub global run flutter_project_builder "$@"; }
          fpb generate feature product --fields "id:int,title:String,price:double?,at:DateTime"
          fpb generate page settings
          fpb generate widget info_card
          fpb generate provider cart --type async
          fpb generate model address --fields "street:String,zip:int?"

      - name: Analyze generated project
        working-directory: ${{ runner.temp }}/app
        run: |
          flutter pub get
          flutter analyze

      - name: Test generated project
        working-directory: ${{ runner.temp }}/app
        run: flutter test

  platforms:
    name: Build ${{ matrix.platform }} (enterprise template)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            build: flutter build apk --debug --flavor dev
          - platform: ios
            os: macos-latest
            build: flutter build ios --simulator --debug --flavor dev
          - platform: macos
            os: macos-latest
            build: flutter build macos --debug --flavor dev
          - platform: ios (CocoaPods)
            os: macos-latest
            cocoapods: true
            build: flutter build ios --simulator --debug --flavor dev
          - platform: macos (CocoaPods)
            os: macos-latest
            cocoapods: true
            build: flutter build macos --debug --flavor dev
          - platform: linux
            os: ubuntu-latest
            build: flutter build linux --debug
          - platform: windows
            os: windows-latest
            build: flutter build windows --debug
          - platform: web
            os: ubuntu-latest
            build: flutter build web
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Use CocoaPods instead of Swift Package Manager
        if: matrix.cocoapods
        run: flutter config --no-enable-swift-package-manager

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Activate CLI from source
        run: dart pub global activate --source path .

      - name: Create app and generate architecture (one command)
        run: |
          cd "$RUNNER_TEMP"
          dart pub global run flutter_project_builder create my_app --no-interactive --template=enterprise --org=io.acme
          cd my_app
          dart pub global run flutter_project_builder generate feature product

      - name: Build
        run: |
          cd "$RUNNER_TEMP/my_app"
          echo "::notice::$(flutter --version | head -1)"
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "::notice::$(xcodebuild -version | tr '\n' ' ') / CocoaPods $(pod --version) / Podfiles: $(ls ios/Podfile macos/Podfile 2>/dev/null | tr '\n' ' ')"
          fi
          set -o pipefail
          if ! ${{ matrix.build }} 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            # Surface the failure as annotations (readable without log access).
            grep -iE "error|failed|exception|required|deployment target" \
              "$RUNNER_TEMP/build.log" | tail -20 | sed 's/^/::error::/'
            exit 1
          fi

  pana:
    name: Package Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Install pana
        run: dart pub global activate pana

      - name: Run pana
        run: dart pub global run pana --no-warning --exit-code-threshold 0
